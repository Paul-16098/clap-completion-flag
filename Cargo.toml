[package]
name = "clap-completion-flag"
version = "1.0.0"
edition = "2024"
license-file = "LICENSE.txt"

[dependencies]
carapace_spec_clap = "1.2.3"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.2"

[dev-dependencies]
insta = "1.48.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
